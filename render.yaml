services:
  - type: web
    name: nova-ai
    runtime: python
    plan: starter          # free instances spin down and drop the LiveKit registration
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      - key: DATA_DIR
        value: /var/data
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://your-frontend.com
      - key: TOKEN_API_KEY
        sync: false        # optional shared secret for /api/token
    disk:
      name: nova-data
      mountPath: /var/data
      sizeGB: 1
